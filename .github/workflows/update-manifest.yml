name: Update manifest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to the latest release)"
        required: false
  repository_dispatch:
    types: [tridennote-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/update-manifest.sh ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Manifest already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "tridennote $(jq -r .version bucket/tridennote.json)"
          git push
